[project]
name = "relay"
version = "0.1.0"
description = "RELAY — self-hosted distributed job queue"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/db", "packages/domain", "packages/observability", "packages/security"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic autogenerates these in its own style (unwrapped lines,
# Union[]/Optional instead of |) — every future migration would hit the
# same style errors, so hand-fixing generated output isn't worth it.
extend-exclude = ["migrations/versions/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags function calls in argument defaults as a mutable-default
# footgun — correct for general Python, but Depends(...) as a default is
# FastAPI's own documented, required dependency-injection idiom, and it
# recurs on essentially every route and dependency function from here on.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
# Anchors each src/ layout dir as a package root, so a file reached by
# `mypy .` walking the tree resolves to the same dotted module name as
# when it's reached through an editable-installed import (relay_x.y) —
# without this, mypy sees the same file as two different modules.
mypy_path = [
    "apps/api/src",
    "apps/worker/src",
    "packages/db/src",
    "packages/domain/src",
    "packages/observability/src",
    "packages/security/src",
]

[[tool.mypy.overrides]]
# asyncpg ships no py.typed marker / stubs (a real gap in the package
# itself, not ours to fix) — only used directly in test code; app code
# goes through SQLAlchemy's async engine, which is fully typed.
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps", "packages", "tests"]
