[project]
name = "relay"
version = "0.1.0"
description = "RELAY — self-hosted distributed job queue"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/domain", "packages/observability"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps", "packages", "tests"]
