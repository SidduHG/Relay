[project]
name = "relay-api"
version = "0.1.0"
description = "RELAY control plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "relay-observability",
    "relay-db",
    "relay-domain",
    "relay-redis",
    "relay-security",
]

[tool.uv.sources]
relay-observability = { workspace = true }
relay-db = { workspace = true }
relay-domain = { workspace = true }
relay-redis = { workspace = true }
relay-security = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_api"]
