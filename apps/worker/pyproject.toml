[project]
name = "relay-worker"
version = "0.1.0"
description = "RELAY worker runtime"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "relay-observability",
]

[tool.uv.sources]
relay-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_worker"]
