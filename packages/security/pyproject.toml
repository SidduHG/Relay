[project]
name = "relay-security"
version = "0.1.0"
description = "RELAY hashing, secret generation and input validation"
requires-python = ">=3.12"
dependencies = ["bcrypt>=4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_security"]
