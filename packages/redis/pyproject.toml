[project]
name = "relay-redis"
version = "0.1.0"
description = "RELAY Redis access — transport, rate limiting, and (later) streams"
requires-python = ">=3.12"
dependencies = ["redis>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_redis"]
