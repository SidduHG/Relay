[project]
name = "relay-db"
version = "0.1.0"
description = "RELAY SQLAlchemy models and Postgres access"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "relay-domain",
]

[tool.uv.sources]
relay-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_db"]
