name: relay

services:
  postgres:
    image: postgres:15-alpine
    env_file: ../../config/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
      POSTGRES_DB: ${POSTGRES_DB:-relay}
    ports:
      # Host 5433 -> container 5432. A native Postgres install on this
      # machine already owns host port 5432; mapping to the same number
      # would make host-side tools (this compose stack's own API/worker
      # containers are unaffected, they talk to "postgres:5432" over the
      # Docker network) silently connect to the wrong server instead of
      # this container. Migrations run from the host use localhost:5433.
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Official Postgres images auto-run every script here, in filename
      # order, but ONLY on a completely fresh data directory — an
      # existing pg_data volume silently skips this on every later start.
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file: ../../config/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../packages:/app/packages

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    env_file: ../../config/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/worker:/app/apps/worker
      - ../../packages:/app/packages

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../../apps/frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pg_data:
